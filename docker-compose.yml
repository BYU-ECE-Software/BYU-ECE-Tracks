services:

  redis:
    image: redis:latest
    container_name: tracks_redis
    restart: always
    command: [
      "redis-server",
      "--save", "",             # no RDB snapshots (sessions are ephemeral)
      "--appendonly", "no",     # disable AOF for sessions
      "--requirepass", "${REDIS_PASSWORD}",
      "--maxmemory", "256mb",   # cap memory
      "--maxmemory-policy", "volatile-ttl"  # evict expiring keys first
    ]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "PING"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - app_network


 
networks:
  app_network:
    driver: bridge